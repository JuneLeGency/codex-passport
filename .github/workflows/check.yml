name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: cc -Wall -Wextra -Werror tests/test_controls.c firmware/main/controls.c -o /tmp/test_controls && /tmp/test_controls
      - run: cc -Wall -Wextra -Werror tests/test_alert_policy.c firmware/main/alert_policy.c -o /tmp/test_alert_policy && /tmp/test_alert_policy
      - run: cc -Wall -Wextra -Werror tests/test_screen_policy.c firmware/main/screen_policy.c firmware/main/alert_policy.c firmware/main/controls.c -o /tmp/test_screen_policy && /tmp/test_screen_policy
